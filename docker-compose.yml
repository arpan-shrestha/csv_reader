version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: csv_loader_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: csv_loader
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: csv_loader_backend
    env_file:
      - ./backend/.env
    environment:
      # Ensure app connects to the postgres service inside docker network
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/csv_loader
    ports:
      - "8000:8000"
    depends_on:
      - postgres
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: csv_loader_frontend
    environment:
      - NEXT_PUBLIC_API_BASE=http://backend:8000/
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data: