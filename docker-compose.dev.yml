version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: csv_loader_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: csv_loader
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: csv_loader_backend
    env_file:
      - ./backend/.env
    environment:
      # override DATABASE_URL so the container uses the postgres service
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/csv_loader
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    depends_on:
      - postgres
    volumes:
      # mount app source for live-editing
      - ./backend/app:/app/app
      # expose env (read-only) for runtime config
      - ./backend/.env:/app/.env:ro
      # persist uploaded csvs (host dir -> container dir)
      - ./backend/app/statics/csv:/app/app/statics/csv

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: csv_loader_frontend
    environment:
      - NEXT_PUBLIC_API_BASE=http://backend:8000/
    # Use dev server with hot-reload and mount source
    command: npm run dev -- --hostname 0.0.0.0 --port 3000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      # keep node_modules from the built image (preinstalled) or as an anonymous volume
      - frontend_node_modules:/app/node_modules

volumes:
  postgres_data:
  frontend_node_modules:
